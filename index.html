<title>예준이 배움터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --cream: oklch(0.96 0.03 85);
    --paper: oklch(0.99 0.012 92);
    --ink: oklch(0.31 0.017 66);
    --clay: oklch(0.64 0.152 40);
    --claysoft: oklch(0.89 0.05 45);
    --sage: oklch(0.68 0.05 155);
    --sagesoft: oklch(0.91 0.025 150);
    --sky: oklch(0.69 0.06 240);
    --skysoft: oklch(0.91 0.028 240);
    --sun: oklch(0.82 0.13 85);
    --ink-08: oklch(0.31 0.017 66 / 0.08);
    --ink-10: oklch(0.31 0.017 66 / 0.10);
    --ink-15: oklch(0.31 0.017 66 / 0.15);
    --ink-20: oklch(0.31 0.017 66 / 0.20);
    --ink-25: oklch(0.31 0.017 66 / 0.25);
    --ink-50: oklch(0.31 0.017 66 / 0.50);
    --ink-55: oklch(0.31 0.017 66 / 0.55);
    --ink-60: oklch(0.31 0.017 66 / 0.60);
    --shadow-soft: 0 18px 40px -28px oklch(0.3 0.03 60 / 0.6);
    --shadow-clay: 0 10px 20px -8px oklch(0.63 0.16 42 / 0.7);
    --font-display: "Jua", "Noto Sans KR", sans-serif;
    --font-sans: "Noto Sans KR", system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }
  html, body{ height: auto; }
  body{
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  h1,h2,h3,p{ margin: 0; }
  button{ font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  a{ color: inherit; text-decoration: none; }
  img,svg{ max-width: 100%; }
  :focus-visible{ outline: 3px solid var(--clay); outline-offset: 2px; border-radius: 0.5rem; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  @keyframes stamp-in{
    0%{ transform: translateY(-16px) scale(1.4) rotate(-8deg); opacity: 0; }
    60%{ transform: translateY(2px) scale(0.92) rotate(2deg); opacity: 1; }
    100%{ transform: translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes pop-in{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .anim-stamp{ animation: stamp-in 0.45s cubic-bezier(0.32, 0.72, 0, 1) both; }
  .anim-pop{ animation: pop-in 0.4s cubic-bezier(0.32, 0.72, 0, 1) both; }

  /* ---- preview notice ---- */
  .preview-banner{
    display: flex;
    align-items: center;
    gap: 0.6rem;
    justify-content: center;
    text-align: center;
    padding: 0.55rem 1rem;
    background: var(--paper);
    border-bottom: 1px solid var(--ink-10);
    font-size: 0.78rem;
    color: var(--ink-60);
  }
  .preview-banner b{ color: var(--ink); font-weight: 600; }
  #sound-help{ position: fixed; left: 0.75rem; right: 0.75rem; top: 0.75rem; max-width: 36rem; margin: 0 auto; z-index: 60; background: var(--paper); border: 1px solid oklch(0.64 0.152 40 / 0.4); border-radius: 1rem; padding: 0.9rem 1rem; box-shadow: var(--shadow-soft); }
  #sound-help[hidden]{ display: none; }
  .sound-help-text{ font-size: 0.85rem; line-height: 1.6; }
  .sound-help-actions{ display: flex; gap: 0.5rem; margin-top: 0.7rem; }
  .sound-help-actions button{ min-height: 2.5rem; padding: 0 1rem; border-radius: 0.75rem; background: var(--clay); color: var(--cream); font-size: 0.85rem; font-weight: 500; }
  .sound-help-actions button.ghost{ background: transparent; color: var(--ink); border: 1px solid var(--ink-15); }

  /* ---- shell ---- */
  .home-main, .learn-main{
    padding: 0 1.5rem 3rem;
    max-width: 56rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
  .learn-main.narrow{ max-width: 48rem; }

  .home-header, .learn-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.25rem 1.5rem;
    max-width: 56rem;
    margin: 0 auto;
  }
  .learn-header{ justify-content: flex-start; }
  .learn-header .header-title{ font-family: var(--font-display); font-size: 1.5rem; }
  .learn-header .header-right{ margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }

  .brand{ display: flex; align-items: center; gap: 0.75rem; }
  .brand-badge{
    width: 2.75rem; height: 2.75rem; border-radius: 1rem;
    background: var(--clay); color: var(--cream);
    display: grid; place-items: center;
    font-family: var(--font-display); font-size: 1.25rem;
    flex-shrink: 0;
  }
  .brand-title{ font-family: var(--font-display); line-height: 1; }
  .brand-sub{ font-size: 0.7rem; color: var(--ink-50); margin-top: 0.25rem; }

  .chip{
    display: flex; align-items: center; gap: 0.5rem;
    border-radius: 999px; background: var(--paper);
    border: 1px solid var(--ink-10);
    padding: 0.5rem 1rem;
    font-size: 0.75rem; font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .chip .dot{ width: 0.6rem; height: 0.6rem; border-radius: 999px; background: var(--sun); flex-shrink: 0; }

  .card{
    background: var(--paper);
    border: 1px solid var(--ink-10);
    border-radius: 1.5rem;
    box-shadow: var(--shadow-soft);
  }

  /* ---- hero ---- */
  .hero{
    padding: 2rem;
    border-radius: 2rem;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 2rem;
  }
  .hero-text{ flex: 1; min-width: 0; }
  .hero-eyebrow{ font-family: var(--font-display); color: var(--clay); margin-bottom: 0.5rem; }
  .hero-title{ font-family: var(--font-display); font-size: 2.2rem; line-height: 1.25; margin-bottom: 1rem; text-wrap: balance; }
  .hero-title .accent{ color: var(--clay); }
  .hero-desc{ color: var(--ink-60); font-size: 0.9rem; line-height: 1.6; max-width: 30rem; }
  .hero-figure{ width: 13rem; flex-shrink: 0; }

  /* ---- buttons ---- */
  .btn-tap{
    min-height: 3.25rem;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 1.5rem;
    border-radius: 1rem;
    touch-action: manipulation;
    user-select: none;
    font-family: var(--font-display);
    font-size: 1.05rem;
    transition: transform 0.15s ease;
  }
  .btn-tap:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--clay); color: var(--cream); box-shadow: var(--shadow-clay); margin-top: 1.5rem; }
  .btn-sky{ background: var(--sky); color: var(--cream); }
  .btn-sage{ background: var(--sage); color: var(--cream); }
  .btn-outline-clay{ background: var(--claysoft); color: var(--clay); font-size: 1rem; padding: 0 1.25rem; }

  /* ---- big cards (home) ---- */
  .big-cards{ display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
  .big-card{
    border-radius: 1.5rem;
    border: 1px solid;
    padding: 1.5rem;
    display: flex; align-items: center; gap: 1rem;
    min-height: 5.5rem;
    touch-action: manipulation;
  }
  .big-card.tone-clay{ background: var(--claysoft); border-color: oklch(0.64 0.152 40 / 0.3); }
  .big-card.tone-sky{ background: var(--skysoft); border-color: oklch(0.69 0.06 240 / 0.3); }
  .big-card.tone-sage{ background: var(--sagesoft); border-color: oklch(0.68 0.05 155 / 0.3); }
  .big-card-face{
    width: 4rem; height: 4rem; flex-shrink: 0;
    border-radius: 1rem; background: var(--paper);
    display: grid; place-items: center;
    font-family: var(--font-display); font-size: 1.7rem;
    color: var(--ink);
  }
  .big-card-copy{ display: flex; flex-direction: column; }
  .big-card-title{ font-family: var(--font-display); font-size: 1.35rem; color: var(--ink); }
  .big-card-sub{ font-size: 0.85rem; color: var(--ink-55); margin-top: 0.2rem; }

  /* ---- two column ---- */
  .two-col{ display: grid; grid-template-columns: 1fr; gap: 1.25rem; }

  .stamp-board{ padding: 1.5rem; }
  .stamp-board-head{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .section-title{ font-family: var(--font-display); font-size: 1.25rem; }
  .section-title.clay{ color: var(--clay); }
  .section-title.sage{ color: var(--sage); }
  .muted{ font-size: 0.85rem; color: var(--ink-50); font-variant-numeric: tabular-nums; }

  .stamp-grid{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; }
  .stamp{ aspect-ratio: 1; border-radius: 999px; display: grid; place-items: center; font-family: var(--font-display); font-size: 0.85rem; }
  .stamp.filled{ background: var(--clay); color: var(--cream); }
  .stamp.empty{ border: 2px dashed var(--ink-20); color: var(--ink-25); font-size: 1.1rem; }

  .mastery-card{ padding: 1.5rem; }
  .mastery-list{ display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
  .mastery-row{ display: flex; align-items: center; gap: 0.75rem; }
  .mastery-syllable{ font-family: var(--font-display); font-size: 1.4rem; width: 2.5rem; text-align: center; flex-shrink: 0; }
  .mastery-track{ flex: 1; height: 0.75rem; border-radius: 999px; background: var(--cream); overflow: hidden; }
  .mastery-fill{ height: 100%; border-radius: 999px; background: var(--sage); transition: width 0.3s ease; }
  .mastery-pct{ font-size: 0.75rem; width: 4.5rem; text-align: right; color: var(--ink-50); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .hint{ font-size: 0.75rem; color: var(--ink-50); margin-top: 1rem; line-height: 1.6; }

  /* ---- learn header ---- */
  .back-btn{ background: var(--paper); border: 1px solid var(--ink-10); padding: 0 1.25rem; font-size: 1rem; }

  /* ---- lesson strip / target strip ---- */
  .round-row{ display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
  .round-dots{ display: flex; gap: 0.4rem; }
  .round-dot{ width: 0.9rem; height: 0.9rem; border-radius: 999px; background: var(--cream); border: 1px solid var(--ink-15); }
  .round-dot.done{ background: var(--clay); border-color: var(--clay); }
  .round-dot.now{ background: var(--claysoft); border: 2px solid var(--clay); }
  .finish-card{ padding: 2rem 1.5rem; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .finish-actions{ display: grid; gap: 0.75rem; width: 100%; grid-template-columns: 1fr; }
  @media (min-width: 640px){ .finish-actions{ grid-template-columns: repeat(3, 1fr); } }
  .btn-next{ background: var(--clay); color: var(--cream); box-shadow: var(--shadow-clay); }
  .finish-actions .back-btn{ display: inline-flex; }
  .syllable-picker{ display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
  .syllable-chip{
    flex-shrink: 0;
    min-height: 3.25rem;
    padding: 0 1.1rem;
    border-radius: 1rem;
    border: 2px solid var(--ink-10);
    font-family: var(--font-display);
    font-size: 1.5rem;
    touch-action: manipulation;
  }
  .chip-plain{ background: var(--paper); color: var(--ink); }
  .chip-mastered{ background: var(--sagesoft); border-color: oklch(0.68 0.05 155 / 0.4); color: var(--sage); }
  .chip-active{ background: var(--clay); border-color: var(--clay); color: var(--cream); }

  .lesson-strip, .target-strip{
    padding: 1.25rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .lesson-syllable{ font-family: var(--font-display); font-size: 3rem; color: var(--clay); flex-shrink: 0; }
  .lesson-syllable.sage{ color: var(--sage); }
  .lesson-info{ flex: 1; min-width: 0; }
  .lesson-words{ font-size: 0.85rem; color: var(--ink-60); margin-bottom: 0.5rem; }
  .target-strip{ background: var(--sagesoft); border-color: oklch(0.68 0.05 155 / 0.3); }
  .target-strip.sky{ background: var(--skysoft); border-color: oklch(0.69 0.06 240 / 0.3); }

  /* ---- quiz card ---- */
  .quiz-card{ padding: 1.75rem; }
  .quiz-prompt{ font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 1.5rem; text-wrap: balance; }
  .quiz-sub{ font-size: 0.85rem; color: var(--ink-55); margin-top: -1rem; margin-bottom: 1.5rem; }
  .accent-num{ font-family: var(--font-display); font-size: 1.4rem; color: var(--sky); font-variant-numeric: tabular-nums; }
  .big-number{ font-family: var(--font-display); font-size: 2.75rem; color: var(--sky); font-variant-numeric: tabular-nums; }

  .option-grid, .option-row{ display: grid; gap: 1rem; }
  .option-row{ grid-auto-flow: column; grid-auto-columns: minmax(4.5rem, 1fr); justify-content: center; flex-wrap: wrap; }
  .grid-3{ grid-template-columns: repeat(3, 1fr); }
  .grid-4{ grid-template-columns: repeat(2, 1fr); }
  .grid-5{ grid-template-columns: repeat(5, 1fr); }
  .grid-tiles{ grid-template-columns: repeat(3, 1fr); }
  @media (min-width: 640px){
    .grid-4{ grid-template-columns: repeat(4, 1fr); }
    .grid-tiles{ grid-template-columns: repeat(4, 1fr); }
  }

  .option-btn{
    min-height: 5.5rem;
    border-radius: 1.5rem;
    border: 2px solid var(--ink-10);
    background: var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.4rem;
    font-family: var(--font-display);
    font-size: 1.5rem;
    touch-action: manipulation;
    transition: transform 0.15s ease;
  }
  .option-btn:active:not(:disabled){ transform: scale(0.96); }
  .option-btn:disabled{ cursor: default; }
  .opt-syllable, .opt-part, .opt-tile{ font-size: 2.5rem; }
  .opt-number{ font-size: 2rem; width: 5.5rem; margin: 0 auto; }
  .opt-native{ font-size: 1.5rem; }
  .opt-order{ font-size: 1.75rem; }
  .opt-emoji{ font-size: 2rem; }
  .opt-text{ font-size: 1.35rem; }

  .opt-neutral{ background: var(--cream); border-color: var(--ink-10); }
  .opt-correct{ background: var(--sagesoft); border-color: var(--sage); color: var(--sage); }
  .opt-wrong{ background: var(--claysoft); border-color: var(--clay); color: var(--clay); }
  .opt-dim{ background: var(--cream); border-color: var(--ink-10); opacity: 0.55; }
  .opt-hit{ background: var(--sage); color: var(--cream); border-color: var(--sage); }
  .opt-hit-sky{ background: var(--sky); color: var(--cream); border-color: var(--sky); }

  .dot-field{ border-radius: 1.5rem; background: var(--cream); padding: 1.75rem; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.1rem; place-items: center; }
  .dot-field.small{ grid-template-columns: repeat(5, auto); padding: 1.25rem; gap: 0.9rem; }
  .dot-big{ width: 2.75rem; height: 2.75rem; border-radius: 999px; background: var(--sky); }
  .dot-big.small{ width: 2.25rem; height: 2.25rem; }

  .mode-row{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
  @media (min-width: 640px){ .mode-row{ grid-template-columns: repeat(4, 1fr); } }
  .seq-row{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; padding: 1rem; border-radius: 1.5rem; background: var(--cream); }
  .seq-cell{ aspect-ratio: 1; border-radius: 1rem; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.9rem; font-variant-numeric: tabular-nums; }
  .seq-fixed{ background: var(--paper); border: 2px solid var(--ink-10); }
  .seq-filled{ background: var(--sagesoft); border: 2px solid var(--sage); color: var(--sage); }
  .seq-current{ background: var(--skysoft); border: 2px dashed var(--sky); color: var(--sky); }
  .seq-empty{ border: 2px dashed var(--ink-25); color: var(--ink-25); }
  .option-row.wrap{ grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(4.5rem, 5.5rem)); margin-top: 1.5rem; }

  .mode-row.two{ grid-template-columns: repeat(2, 1fr); margin-bottom: 1.5rem; }
  .mode-btn{
    min-height: 3.5rem;
    border-radius: 1rem;
    border: 2px solid var(--ink-10);
    background: var(--paper);
    font-family: var(--font-display);
    font-size: 1.1rem;
    touch-action: manipulation;
  }
  .mode-btn.active{ background: var(--sky); color: var(--cream); border-color: var(--sky); }

  .quiz-footer{
    position: sticky;
    bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    z-index: 10;
    margin-top: 2rem;
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 1.5rem;
    border: 1px solid var(--ink-10);
    background: color-mix(in oklab, var(--paper) 94%, transparent);
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(6px);
  }
  .quiz-footer .btn-primary{ margin-top: 0; }
  .quiz-footer .yejun-md{ width: 3.25rem; }
  @media@media (min-width: 640px){ .quiz-footer .yejun-md{ width: 4rem; } }

  .locked-card{ padding: 2.5rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .locked-card .yejun-wrap{ margin-bottom: 0.5rem; }

  /* ---- yejun character ---- */
  .yejun-wrap{ display: flex; align-items: flex-end; gap: 0.75rem; }
  .speech-bubble{
    border-radius: 1.5rem; background: var(--paper); border: 1px solid var(--ink-10);
    padding: 0.75rem 1.25rem; font-size: 1rem; font-family: var(--font-display); color: var(--ink);
    box-shadow: var(--shadow-soft);
  }
  .yejun-img{ display: block; width: 100%; height: auto; mix-blend-mode: multiply; user-select: none; }
  .yejun-pose{ display: block; flex-shrink: 0; background-image: url(yejun-sheet.webp); background-repeat: no-repeat; mix-blend-mode: multiply; user-select: none; }
  .yejun-pose.is-face{ mix-blend-mode: normal; border-radius: 1.25rem; border: 1px solid var(--ink-10); box-shadow: var(--shadow-soft); }
  .peek-wrap{ position: relative; margin-top: 2rem; }
  .peek{ position: absolute; right: 1.25rem; bottom: 100%; height: 4rem; overflow: hidden; pointer-events: none; }
  .peek .peek-fig{ width: 5rem; }
  .quiz-footer .yejun-badge.yejun-md{ width: 4.75rem; }
  .voice-wrap{ text-align: center; }
  .voice-btn{ border: 1px solid var(--ink-15); background: var(--paper); border-radius: 999px; padding: 0.5rem 1.25rem; font-size: 0.85rem; color: var(--ink-60); }
  #voice-panel{ max-width: 28rem; margin: 1rem auto 0; padding: 1.25rem; text-align: left; }
  #voice-panel[hidden]{ display: none; }
  .voice-row{ display: flex; align-items: center; gap: 0.5rem; border: 1px solid var(--ink-10); border-radius: 1rem; padding: 0.7rem; margin-bottom: 0.5rem; }
  .voice-row.on{ border-color: var(--clay); background: oklch(0.89 0.05 45 / 0.4); }
  .voice-name{ flex: 1; min-width: 0; font-size: 0.85rem; }
  .voice-name b{ display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .voice-rec{ font-size: 0.72rem; color: var(--clay); }
  .voice-mini{ border: 1px solid var(--ink-15); background: var(--paper); border-radius: 0.75rem; padding: 0.5rem 0.8rem; font-size: 0.82rem; }
  .voice-mini.pick{ background: var(--clay); color: var(--cream); border-color: var(--clay); }
  .stamp-img{ display: block; width: 100%; aspect-ratio: 1; }
  .yejun-badge{ display: block; height: auto; flex-shrink: 0; }
  #stamp-pop{ position: fixed; left: 0; right: 0; top: 28%; display: flex; justify-content: center; z-index: 50; pointer-events: none; }
  #stamp-pop img{ width: min(12rem, 52vw); filter: drop-shadow(0 18px 28px oklch(0.3 0.03 60 / 0.35)); animation: stamp-big 1.4s cubic-bezier(0.32, 0.72, 0, 1) both; }
  @keyframes stamp-big{ 0%{ transform: scale(0.2) rotate(-14deg); opacity: 0; } 22%{ transform: scale(1.12) rotate(4deg); opacity: 1; } 36%{ transform: scale(0.97) rotate(-2deg); } 50%{ transform: scale(1) rotate(0deg); opacity: 1; } 100%{ transform: scale(1) rotate(0deg); opacity: 0; } }
  .yejun-sm{ width: 3rem; }
  .yejun-md{ width: 5.5rem; }
  .yejun-lg{ width: 8rem; }
  .yejun-xl{ width: 100%; }

  @media (min-width: 640px){
    .hero{ flex-direction: row; padding: 2.5rem; }
    .hero-figure{ width: 15rem; }
    .big-cards{ grid-template-columns: repeat(3, 1fr); }
    .home-header, .learn-header, .home-main, .learn-main{ padding-left: 2rem; padding-right: 2rem; }
  }
  @media (min-width: 1024px){
    .two-col{ grid-template-columns: 1fr 1fr; }
  }

  }

  // ---------- game (보너스 놀이: 글자 잡기 + 숫자 잡기) ----------
  var gameMode = "hangul", gameTarget = "고", gameTiles = [], gameDone = false, gameStarted = false;
  function startGame(mode){
    gameMode = mode;
    var chars = [];
    if (mode === "hangul") {
      var lesson = pickRandom(syllableLessons);
      var others = shuffle(syllableLessons.filter(function (l) { return l.syllable !== lesson.syllable; }).map(function (l) { return l.syllable; }));
      for (var i = 0; i < 4; i++) chars.push(lesson.syllable);
      var k = 0;
      while (chars.length < 12) { chars.push(others[k % others.length]); k++; }
      gameTarget = lesson.syllable;
      speak(gameTarget + " 를 모두 찾아요");
    } else {
      var item = pickRandom(numberItems);
      var wrongNums = shuffle(numberItems.filter(function (n) { return n.value !== item.value; }).map(function (n) { return String(n.value); }));
      for (var j = 0; j < 4; j++) chars.push(String(item.value));
      var m = 0;
      while (chars.length < 12) { chars.push(wrongNums[m % wrongNums.length]); m++; }
      gameTarget = String(item.value);
      speak("숫자 " + item.value + " 를 모두 찾아요");
    }
    gameTiles = shuffle(chars).map(function (ch, id) { return { id: id, ch: ch, hit: false }; });
    gameDone = false;
    gameStarted = true;
  }
  function gameSwitchMode(mode){
    startGame(mode);
    renderPage();
  }
  function gameTap(id){
    var tile = gameTiles.filter(function (t) { return t.id === id; })[0];
    if (!tile || tile.hit) return;
    if (tile.ch !== gameTarget) { speak("아니에요. 다시 찾아봐요"); return; }
    tile.hit = true;
    speak(gameMode === "hangul" ? gameTarget : "숫자 " + gameTarget);
    if (gameTiles.filter(function (t) { return t.ch === gameTarget; }).every(function (t) { return t.hit; })) {
      gameDone = true;
      addStamp((gameMode === "hangul" ? "놀이 " : "숫자놀이 ") + gameTarget);
      speak("다 찾았어요! 잘했어요!");
    }
    renderPage();
  }
  function renderGame(){
    var progress = getProgress();
    var unlocked = progress.stamps >= 5;
    if (!unlocked) {
      app.innerHTML =
        learnHeaderHTML("보너스 놀이", progress.stamps, "neutral") +
        '<main class="learn-main narrow"><div class="card locked-card">' +
        yejunHTML({ size: "lg", pose: "threeQuarter", says: "도장 5개 모으면 놀자!" }) +
        '<p class="quiz-prompt">도장이 조금 더 필요해요</p>' +
        '<p class="muted">지금 ' + progress.stamps + "개 · " + Math.max(0, 5 - progress.stamps) + "개 더 모으면 열려요</p>" +
        '<a class="btn-tap btn-primary" href="#/hangul">한글 배우러 가기</a></div></main>';
      return;
    }
    if (!gameStarted) startGame(gameMode);
    var tone = gameMode === "hangul" ? "sage" : "sky";
    var modeButtons =
      '<button class="mode-btn ' + (gameMode === "hangul" ? "active" : "") + '" data-action="game-mode" data-mode="hangul">글자 잡기</button>' +
      '<button class="mode-btn ' + (gameMode === "numbers" ? "active" : "") + '" data-action="game-mode" data-mode="numbers">숫자 잡기</button>';
    app.innerHTML =
      learnHeaderHTML("보너스 놀이", progress.stamps, "warm") +
      '<main class="learn-main narrow"><div class="mode-row two">' + modeButtons + '</div>' +
      '<div class="card target-strip ' + (tone === "sky" ? "sky" : "") + '"><span class="lesson-syllable ' + tone + '">' + gameTarget + '</span>' +
      '<p class="quiz-prompt">' + (gameMode === "hangul" ? "이 글자를 모두 찾아요" : "이 숫자를 모두 찾아요") + '</p></div>' +
      '<div class="option-grid grid-tiles">' +
      gameTiles.map(function (t) {
        return '<button class="option-btn opt-tile ' + (t.hit ? (tone === "sky" ? "opt-hit-sky anim-stamp" : "opt-hit anim-stamp") : "") + '" data-action="game-tap" data-id="' + t.id + '"' + (t.hit ? " disabled" : "") + ">" + t.ch + "</button>";
      }).join("") + "</div>" +
      (gameDone
        ? '<div class="quiz-footer">' + yejunHTML({ size: "md", pose: "warm", says: "다 찾았어요! 도장 찍기 🎉" }) +
          '<button class="btn-tap ' + (tone === "sky" ? "btn-sky" : "btn-sage") + '" data-action="game-restart">한 번 더</button></div>'
        : "") +
      "</main>";
  }

  // ---------- router ----------
  var ROUTES = { "": "home", "#/": "home", "#/hangul": "hangul", "#/numbers": "numbers", "#/game": "game" };
  function currentRouteName(){ return ROUTES[location.hash || "#/"] || "home"; }
  var lastRoute = null;
  function resetEphemeralFor(name){
    if (name === "hangul") { hangulLesson = null; hangulQuestion = null; hangulResult = "none"; hangulWrong = []; }
    if (name === "numbers") { numbersMode = "count"; numbersTask = null; numbersResult = "none"; numbersPicked = null; numbersOrderNext = 1; numbersOrderTiles = []; numbersBlank = null; numbersBlankFilled = 0; numbersBlankWrong = null; }
    if (name === "game") { gameStarted = false; gameDone = false; gameTiles = []; }
  }
  function renderPage(){
    var name = currentRouteName();
    if (name !== lastRoute) { resetEphemeralFor(name); lastRoute = name; }
    if (name === "hangul") renderHangul();
    else if (name === "numbers") renderNumbers();
    else if (name === "game") renderGame();
    else renderHome();
  }

  window.addEventListener("hashchange", function () { renderPage(); window.scrollTo({ top: 0 }); });

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;
    if (action === "speak") speak(el.dataset.text);
    else if (action === "voice-toggle") { var vp = document.getElementById("voice-panel"); vp.hidden = !vp.hidden; renderVoicePanel(); }
    else if (action === "voice-hear") speak(SAMPLE_LINE, 0.88, el.dataset.voice);
    else if (action === "voice-pick") { try { localStorage.setItem(VOICE_KEY, el.dataset.voice); } catch (e) {} renderVoicePanel(); }
    else if (action === "hangul-answer") hangulAnswer(el.dataset.value);
    else if (action === "hangul-next") hangulNext();
    else if (action === "hangul-pick") hangulSelectSyllable(el.dataset.syllable);
    else if (action === "hangul-finish") { hangulFinished = true; speak("잘 익혔어요! 잘했어요!"); renderPage(); }
    else if (action === "hangul-restart") { enterHangul(); renderPage(); }
    else if (action === "numbers-mode") numbersSetMode(el.dataset.mode);
    else if (action === "numbers-answer") numbersAnswer(el.dataset.value);
    else if (action === "numbers-next") numbersNext();
    else if (action === "numbers-blank") numbersTapBlank(Number(el.dataset.n));
    else if (action === "numbers-order") numbersTapOrder(Number(el.dataset.n));
    else if (action === "game-tap") gameTap(Number(el.dataset.id));
    else if (action === "game-mode") gameSwitchMode(el.dataset.mode);
    else if (action === "game-restart") { startGame(gameMode); renderPage(); }
  });

  document.getElementById("sound-test").addEventListener("click", function () { speak("안녕 예준아"); });
  document.getElementById("sound-close").addEventListener("click", function () { soundHelpClosed = true; document.getElementById("sound-help").hidden = true; });
  var envProblem = soundEnvProblem();
  if (envProblem) showSoundHelp(envProblem);

  renderPage();
})();
</script>
